user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Docker's embedded DNS. Combined with the variables in proxy_pass below, this
    # makes nginx re-resolve backend container IPs at runtime (re-checked every 10s)
    # instead of caching them once at startup. That way, restarting any backend
    # container (which gives it a new IP) no longer causes 502s until nginx itself
    # is restarted. NOTE: using a variable in proxy_pass disables nginx's automatic
    # location-prefix stripping, so each location below reproduces its original URI
    # behavior explicitly via rewrite.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / { return 301 /zabbix/; }

        location /zabbix/ {
            set $up_zabbix zabbix-web:8080;
            rewrite ^/zabbix/(.*)$ /$1 break;
            proxy_pass http://$up_zabbix;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /grafana/ {
            set $up_grafana grafana:3000;
            # Grafana is served under /grafana/ (GF_SERVER_ROOT_URL), so the URI is
            # passed through unchanged — equivalent to the old proxy_pass .../grafana/.
            proxy_pass http://$up_grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /vm/ {
            set $up_vm victoriametrics:8428;
            rewrite ^/vm/(.*)$ /$1 break;
            proxy_pass http://$up_vm;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /glpi {
            set $up_glpi glpi:80;
            rewrite ^/glpi$ /glpi/ permanent;
            rewrite ^/glpi/(.*)$ /$1 break;
            proxy_pass http://$up_glpi;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /glpi/;
        }

        # GLPI Symfony router paths (PascalCase routes generated by GLPI 11.x)
        location ~ ^/(ServiceCatalog|Helpdesk|Form|Central|Config|Altcha|GenericAjaxCrud|Inventory|MFA|Session|UI)(/|$) {
            set $up_glpi glpi:80;
            proxy_pass http://$up_glpi;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /.well-known/ {
            set $up_glpi glpi:80;
            proxy_pass http://$up_glpi;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(lib|css|css_compiled|js|pics|public|plugins|marketplace|front|ajax|install|vendor|inc|src|templates|build)/ {
            set $up_glpi glpi:80;
            proxy_pass http://$up_glpi;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/[^/]+\.php$ {
            set $up_glpi glpi:80;
            proxy_pass http://$up_glpi;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reports Portal
        location /reports/ {
            set $up_reports reporting-portal:5000;
            rewrite ^/reports/(.*)$ /$1 break;
            proxy_pass http://$up_reports;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health { return 200 "OK\n"; }
    }
}
