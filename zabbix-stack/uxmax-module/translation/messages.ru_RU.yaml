hints:
  windrag: 'Позволяет перемещать модальные диалоги, захватывая их за заголовок мышью. Предназначено главным образом для Zabbix 7.0, в котором эта функция не поддерживается нативно — Zabbix 7.4 уже поддерживает перетаскивание модальных окон из коробки.'
  latest-show-disabled: 'В Monitoring → Latest data также будут отображаться отключённые элементы. Строки отключённых элементов отображаются серым цветом со значком ''D'' в столбце Info.'
  hide-widget-header: 'У виджетов с отключённой опцией „Show header" заголовок полностью скрывается — он не появляется даже при наведении мыши. Заголовок снова отображается только после переключения дашборда в режим редактирования.'
  compact-dashboard: 'Убирает отступы вокруг виджетов, чтобы они располагались вплотную друг к другу. Экономит место на насыщенных дашбордах и придаёт более компактный вид.'
  color-theme: 'Настраиваемый цвет фона страницы и/или боковой панели. Полезно для визуального различения нескольких экземпляров Zabbix с первого взгляда.'
  modal-width: 'Задаёт минимальную ширину модальных диалогов в пикселях. Полезно, когда размер по умолчанию слишком узкий для содержимого диалога.'
  custom-font: "Загружает пользовательский шрифт (через URL Google Fonts или загруженный файл) и применяет его во всём интерфейсе Zabbix.\nПример URL: https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
  color-tags: 'Теги по всему интерфейсу окрашиваются согласно вашим правилам — их легче различить с первого взгляда.'
  syntax-highlight: 'Подсветка синтаксиса для JavaScript-скриптов (script items, preprocessing) и выражений Zabbix (триггеры, вычисляемые элементы) в редакторах.'
  allow-user-override: 'Когда включено, пользователи могут в My uxMAX задавать собственные правила цветов тегов, которые применяются поверх глобальных. Когда выключено, действуют только глобальные правила, а меню My uxMAX скрыто от пользователей.'
