hints:
  windrag: 'マウスでタイトルバーをドラッグしてモーダルダイアログを移動できるようにします。主にこの機能をネイティブにサポートしていない Zabbix 7.0 向けです — Zabbix 7.4 ではモーダルのドラッグが標準で利用できます。'
  latest-show-disabled: 'Monitoring → Latest data に無効化されたアイテムも表示します。無効化されたアイテムの行はグレー表示され、Info 列に「D」アイコンが付きます。'
  hide-widget-header: '「Show header」のチェックを外したウィジェットでは、ヘッダーが完全に非表示になります — マウスホバー時にも表示されません。ヘッダーはダッシュボードを編集モードに切り替えたときにのみ再表示されます。'
  compact-dashboard: 'ウィジェット周囲の余白を取り除き、互いにぴったりと並べて表示します。情報量の多いダッシュボードで省スペース化でき、よりコンパクトな見た目になります。'
  color-theme: 'ページおよび／またはサイドバーの背景色をカスタマイズします。複数の Zabbix インスタンスを一目で見分けたいときに便利です。'
  modal-width: 'モーダルダイアログの最小幅をピクセル単位で設定します。デフォルトサイズではダイアログ内容に対して幅が狭すぎる場合に便利です。'
  custom-font: "カスタムフォント（Google Fonts URL またはアップロードしたフォントファイル）を読み込み、Zabbix UI 全体に適用します。\nURL の例: https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
  color-tags: 'UI 全体のタグがルールに従って色付けされ、一目で識別しやすくなります。'
  syntax-highlight: 'エディター内の JavaScript スクリプト（script item、preprocessing）および Zabbix 式（トリガー、計算アイテム）のシンタックスハイライトを行います。'
  allow-user-override: '有効にすると、ユーザーは My uxMAX で独自のタグカラールールを定義でき、それがグローバルルールの上に適用されます。無効にすると、グローバルルールのみが適用され、My uxMAX メニューはユーザーから非表示になります。'
