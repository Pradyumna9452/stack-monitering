hints:
  windrag: 'Permet de déplacer les boîtes de dialogue modales en les saisissant par leur barre de titre avec la souris. Destiné principalement à Zabbix 7.0, qui ne prend pas en charge cette fonction de manière native — Zabbix 7.4 propose déjà le déplacement des modales en natif.'
  latest-show-disabled: 'Affiche les éléments désactivés dans Monitoring → Latest data. Les lignes des éléments désactivés apparaissent en grisé avec une icône ''D'' dans la colonne Info.'
  hide-widget-header: 'Pour les widgets dont l''option „Show header" est décochée, l''en-tête est entièrement masqué — il n''apparaît pas non plus au survol de la souris. L''en-tête ne réapparaît qu''en passant le tableau de bord en mode édition.'
  compact-dashboard: 'Supprime les marges autour des widgets pour qu''ils soient collés les uns aux autres. Économise de la place sur les tableaux de bord chargés et offre un rendu plus compact.'
  color-theme: 'Couleur de fond personnalisée pour la page et/ou la barre latérale. Utile pour distinguer visuellement plusieurs instances Zabbix d''un coup d''œil.'
  modal-width: 'Définit une largeur minimale en pixels pour les boîtes de dialogue modales. Utile lorsque la taille par défaut est trop étroite pour le contenu de la boîte.'
  custom-font: "Charge une police personnalisée (via URL Google Fonts ou fichier de police téléversé) et l'applique à toute l'interface Zabbix.\nExemple d'URL : https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
  color-tags: 'Les tags de toute l''interface sont colorés selon vos règles — plus faciles à identifier d''un coup d''œil.'
  syntax-highlight: 'Coloration syntaxique pour les scripts JavaScript (éléments de script, prétraitement) et les expressions Zabbix (déclencheurs, éléments calculés) dans les éditeurs.'
  allow-user-override: 'Lorsque activé, les utilisateurs peuvent définir dans My uxMAX leurs propres règles de couleurs de tags, appliquées par-dessus les règles globales. Lorsque désactivé, seules les règles globales s''appliquent et le menu My uxMAX est masqué pour les utilisateurs.'
