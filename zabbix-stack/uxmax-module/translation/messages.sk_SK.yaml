hints:
  windrag: 'Umožní presúvať modálne okná uchopením za záhlavie myšou. Určené hlavne pre Zabbix 7.0, ktorý túto funkciu natívne nemá — Zabbix 7.4 už presúvanie modálnych okien podporuje sám.'
  latest-show-disabled: 'V Monitoring → Latest data budú viditeľné aj deaktivované položky. Riadky deaktivovaných položiek sú zobrazené sivo s ikonou ''D'' v stĺpci Info.'
  hide-widget-header: 'Pri widgetoch s odškrtnutým „Show header" sa hlavička úplne skryje — nezobrazí sa ani po nabehnutí myšou. Hlavička sa objaví iba po prepnutí dashboardu do režimu úprav.'
  compact-dashboard: 'Odstráni medzery okolo widgetov, takže priliehajú tesne k sebe. Šetrí miesto na hustých dashboardoch a pôsobí kompaktnejším dojmom.'
  color-theme: 'Vlastná farba pozadia stránky a/alebo bočného menu. Užitočné pre vizuálne rozlíšenie viacerých Zabbix inštancií na prvý pohľad.'
  modal-width: 'Nastaví minimálnu šírku modálnych okien v pixeloch. Užitočné keď je predvolená veľkosť pre obsah dialógu príliš úzka.'
  custom-font: "Načíta vlastné písmo (cez URL Google Fontu alebo nahraný súbor) a aplikuje ho v celom Zabbix UI.\nPríklad URL: https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
  color-tags: 'Tagy v celom UI sú zafarbené podľa vašich pravidiel — jednoduchšia rýchla orientácia.'
  syntax-highlight: 'Farebné zvýraznenie syntaxe pre JavaScript skripty (script item, preprocessing) a Zabbix výrazy (triggery, kalkulované položky) v editoroch.'
  allow-user-override: 'Keď je zapnuté, používatelia si môžu v My uxMAX definovať vlastné pravidlá pre farby tagov, ktoré sa pridajú ku globálnym. Keď je vypnuté, platia iba globálne pravidlá a menu My uxMAX sa používateľom skryje.'
