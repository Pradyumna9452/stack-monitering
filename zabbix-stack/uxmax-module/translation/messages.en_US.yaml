hints:
    windrag: 'Allows dragging modal dialogs by grabbing their title bar with the mouse. Intended mainly for Zabbix 7.0, which does not support this natively — Zabbix 7.4 already provides modal dragging out of the box.'
    latest-show-disabled: 'Shows disabled items in Monitoring → Latest data. Rows for disabled items appear greyed out with a ''D'' badge in the Info column.'
    hide-widget-header: 'For widgets with ''Show header'' unchecked, hides the header completely — it is not shown even on mouse hover. The header reappears only when the dashboard is switched to edit mode.'
    compact-dashboard: 'Removes the padding around widgets so they sit flush against each other. Saves space on dense dashboards and gives a more compact look.'
    color-theme: 'Custom background color for the page body and/or the sidebar. Useful for visually distinguishing multiple Zabbix instances at a glance.'
    modal-width: 'Sets a minimum pixel width for modal dialogs. Useful when the default size is too narrow for the dialog''s content.'
    custom-font: "Loads a custom font (via Google Fonts URL or an uploaded font file) and applies it across the Zabbix UI.\nExample URL: https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
    color-tags: 'Tags throughout the UI are coloured according to your rules, making them easier to scan at a glance.'
    syntax-highlight: 'Syntax highlighting for JavaScript scripts (script items, preprocessing) and Zabbix expressions (triggers, calculated items) in editors.'
    allow-user-override: 'When enabled, users may define their own color tag rules in My uxMAX, layered on top of the global ones. When disabled, only the global rules apply and the My uxMAX menu is hidden from users.'
