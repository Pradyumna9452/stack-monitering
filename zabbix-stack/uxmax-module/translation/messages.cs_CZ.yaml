hints:
  windrag: 'Umožní přesouvat modální okna (dialogy) uchopením za jejich záhlaví myší. Určeno hlavně pro Zabbix 7.0, který tuto funkci nativně nemá — Zabbix 7.4 už přetahování modálních oken podporuje sám.'
  latest-show-disabled: 'V Monitoring → Latest data budou viditelné i deaktivované položky. Řádky deaktivovaných položek jsou zobrazené šedě s ikonou ''D'' ve sloupci Info.'
  hide-widget-header: 'U widgetů s odškrtnutým „Show header" se hlavička úplně skryje — nezobrazí se ani po najetí myši. Hlavička se objeví pouze po přepnutí dashboardu do režimu úprav.'
  compact-dashboard: 'Odstraní mezery kolem widgetů, takže přiléhají těsně k sobě. Šetří místo na hustých dashboardech a působí kompaktnějším dojmem.'
  color-theme: 'Vlastní barva pozadí stránky a/nebo postranního menu. Užitečné pro vizuální rozlišení více Zabbix instancí na první pohled.'
  modal-width: 'Nastaví minimální šířku modálních oken v pixelech. Užitečné když výchozí velikost je pro obsah dialogu příliš úzká.'
  custom-font: "Načte vlastní písmo (přes URL Google Fontu nebo nahraný soubor) a aplikuje ho v celém Zabbix UI.\nPříklad URL: https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
  color-tags: 'Tagy v celém UI jsou obarvené podle vašich pravidel — snadnější rychlá orientace.'
  syntax-highlight: 'Barevné zvýraznění syntaxe pro JavaScript skripty (script item, preprocessing) a Zabbix výrazy (triggery, kalkulované položky) v editorech.'
  allow-user-override: 'Když je zapnuto, uživatelé si mohou v My uxMAX definovat vlastní pravidla pro barvy tagů, která se přidají k globálním. Když je vypnuto, platí pouze globální pravidla a menu My uxMAX se uživatelům skryje.'
