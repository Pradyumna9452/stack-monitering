hints:
  windrag: 'Permite arrastrar diálogos modales sujetándolos por la barra de título con el ratón. Pensado principalmente para Zabbix 7.0, que no admite esta función de forma nativa — Zabbix 7.4 ya incluye el arrastre de modales de serie.'
  latest-show-disabled: 'Muestra los elementos deshabilitados en Monitoring → Latest data. Las filas de elementos deshabilitados aparecen en gris con un icono ''D'' en la columna Info.'
  hide-widget-header: 'En los widgets con „Show header" desmarcado, la cabecera se oculta por completo — tampoco aparece al pasar el ratón. La cabecera vuelve a mostrarse solo cuando el dashboard se cambia al modo edición.'
  compact-dashboard: 'Elimina el espaciado alrededor de los widgets para que queden pegados entre sí. Ahorra espacio en dashboards densos y ofrece un aspecto más compacto.'
  color-theme: 'Color de fondo personalizado para la página y/o la barra lateral. Útil para distinguir visualmente varias instancias de Zabbix de un vistazo.'
  modal-width: 'Define un ancho mínimo en píxeles para los diálogos modales. Útil cuando el tamaño por defecto resulta demasiado estrecho para el contenido del diálogo.'
  custom-font: "Carga una fuente personalizada (mediante URL de Google Fonts o archivo de fuente subido) y la aplica en toda la interfaz de Zabbix.\nURL de ejemplo: https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
  color-tags: 'Las etiquetas en toda la UI se colorean según tus reglas — facilita identificarlas de un vistazo.'
  syntax-highlight: 'Resaltado de sintaxis para scripts JavaScript (elementos de script, preprocesado) y expresiones de Zabbix (triggers, elementos calculados) en los editores.'
  allow-user-override: 'Cuando está activado, los usuarios pueden definir en My uxMAX sus propias reglas para colores de etiquetas, aplicadas encima de las globales. Cuando está desactivado, solo se aplican las reglas globales y el menú My uxMAX se oculta a los usuarios.'
