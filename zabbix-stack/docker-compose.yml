# Cap container log files so they cannot fill the disk again
# (json-file driver: 5 x 20MB = 100MB max per container).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ===========================================
  # 1. PostgreSQL (Zabbix Database)
  # ===========================================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: zabbix-postgres
    logging: *default-logging
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_DB=zabbix
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # admin client cert (root-owned) for cert-based local admin psql
      - /etc/zabbix-stack/certs/admin:/run/db-certs:ro
    networks:
      - zabbix-net
    restart: unless-stopped
    healthcheck:
      # Connect over TLS with the client cert (via the mounted /run/db-certs) so the
      # probe matches the `hostssl ... cert` pg_hba rule and succeeds cleanly. The old
      # `pg_isready -U zabbix` used the local unix socket, which is `reject` under the
      # cert-only policy, so every 10s it logged a FATAL "pg_hba rejects ... no
      # encryption" (pg_isready still returned up, so this was cosmetic log spam).
      # sslmode=require (not verify-full): a liveness probe shouldn't fail on server
      # cert/hostname/DNS issues; it still presents the client cert to pass hostssl.
      test: ["CMD-SHELL", "PGSSLMODE=require PGSSLROOTCERT=/run/db-certs/ca.crt PGSSLCERT=/run/db-certs/client.crt PGSSLKEY=/run/db-certs/client.key pg_isready -h 127.0.0.1 -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # 2. Zabbix Server (Native Connector Enabled)
  # ===========================================
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4.12
    container_name: zabbix-server
    logging: *default-logging
    environment:
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=zabbix
      - POSTGRES_DB=zabbix
      # Passwordless DB auth via client TLS certificate (no password stored anywhere)
      - ZBX_DBTLSCONNECT=verify_full
      - ZBX_DBTLSCAFILE=/run/db-certs/ca.crt
      - ZBX_DBTLSCERTFILE=/run/db-certs/client.crt
      - ZBX_DBTLSKEYFILE=/run/db-certs/client.key
      # Cache tuning
      - ZBX_CACHESIZE=1024M
      - ZBX_HISTORYCACHESIZE=512M
      - ZBX_HISTORYINDEXCACHESIZE=256M
      - ZBX_TRENDCACHESIZE=256M
      - ZBX_VALUECACHESIZE=512M

      - ZBX_WEBSERVICEURL=http://zabbix-web-service:10053/report
      - ZBX_STARTCONNECTORS=1
      - ZBX_STARTREPORTWRITERS=3
    volumes:
      - /etc/zabbix-stack/certs/client:/run/db-certs:ro
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
    depends_on:
      - postgres
    restart: unless-stopped

  # ===========================================
  # 3. Zabbix Web Frontend
  # ===========================================
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.12
    container_name: zabbix-web
    logging: *default-logging
    environment:
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=zabbix
      - POSTGRES_DB=zabbix
      # Tag all frontend/API DB connections so the sonic_lock_ins trigger can block
      # ONLY the frontend (user-initiated creates) while allowing the zabbix-server's
      # own connections (empty app_name) — makes the single-tenant lockdown permanent
      # AND upgrade-safe (server migrations are not blocked). php-fpm clear_env=no, so
      # libpq picks up PGAPPNAME.
      - PGAPPNAME=zabbix-frontend
      # Passwordless DB auth via client TLS certificate (no password stored anywhere).
      # This image needs BOTH variable sets — they feed two different layers:
      #   * ZBX_DB_*    -> the PHP frontend (zabbix.conf.php reads these names).
      #   * ZBX_DBTLS*  -> the entrypoint's psql readiness/upgrade layer
      #                    (pgsql.sh set_pg_env builds PGSSLCERT/KEY/ROOTCERT ONLY
      #                    from ZBX_DBTLSCERTFILE/KEYFILE/CAFILE).
      # Setting only one set breaks the other: ZBX_DB_* alone made the psql probe
      # do SSL-without-cert ("connection requires a valid client certificate");
      # ZBX_DBTLS* alone made PHP do plaintext/no-password ("Error connecting to
      # database"). Keep both in sync.
      - ZBX_DB_ENCRYPTION=true
      - ZBX_DB_VERIFY_HOST=true
      - ZBX_DB_CA_FILE=/run/db-certs/ca.crt
      - ZBX_DB_CERT_FILE=/run/db-certs/client.crt
      - ZBX_DB_KEY_FILE=/run/db-certs/client.key
      - ZBX_DBTLSCONNECT=verify_full
      - ZBX_DBTLSCAFILE=/run/db-certs/ca.crt
      - ZBX_DBTLSCERTFILE=/run/db-certs/client.crt
      - ZBX_DBTLSKEYFILE=/run/db-certs/client.key
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=${TIMEZONE:-Asia/Kolkata}
      # Raise PHP limits: default 128M memory_limit was exhausted in db.inc.php
      # by heavy API queries (problem.get over 325 problems via Grafana panels),
      # killing the php-fpm child mid-request -> Grafana "Client.Timeout".
      # max_execution_time must stay >= 300 (Zabbix frontend prerequisite check).
      - ZBX_MEMORYLIMIT=512M
      - ZBX_MAXEXECUTIONTIME=300
    volumes:
      - /etc/zabbix-stack/certs/client:/run/db-certs:ro
      - ./sonic-module:/usr/share/zabbix/modules/sonic_overview:ro
      # uxMAX UI module (initMAX). Config is stored in the Zabbix DB (module
      # table / CProfile / images), not in files, so a read-only mount is safe.
      - ./uxmax-module:/usr/share/zabbix/modules/uxmax:ro
    networks:
      - zabbix-net
    depends_on:
      - zabbix-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================
  # 4. Zabbix Web Service (Reports)
  # ===========================================
  zabbix-web-service:
    image: zabbix/zabbix-web-service:alpine-7.4.12
    container_name: zabbix-web-service
    logging: *default-logging
    networks:
      - zabbix-net
    restart: unless-stopped

  # ===========================================
  # 5. Zabbix Agent
  # ===========================================
  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.4.12
    container_name: zabbix-agent
    logging: *default-logging
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_HOSTNAME=Zabbix server
    networks:
      - zabbix-net
    depends_on:
      - zabbix-server
    restart: unless-stopped

  # ===========================================
  # 6. GLPI MariaDB
  # ===========================================
  glpi-mariadb:
    image: mariadb:10.11
    container_name: glpi-mariadb
    logging: *default-logging
    environment:
      - MARIADB_ROOT_PASSWORD=${GLPI_DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=glpi
      - MARIADB_USER=glpi
      - MARIADB_PASSWORD=${GLPI_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - glpi_mariadb_data:/var/lib/mysql
    networks:
      - zabbix-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # 7. GLPI
  # ===========================================
  glpi:
    image: diouxx/glpi:latest
    container_name: glpi
    logging: *default-logging
    environment:
      - TIMEZONE=${TIMEZONE:-Asia/Kolkata}
    volumes:
      - glpi_data:/var/www/html/glpi
    networks:
      - zabbix-net
    depends_on:
      - glpi-mariadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # 8. GLPI Integration Service
  # ===========================================
  glpi-webhook:
    build:
      context: ./zabbix-glpi-integration
      dockerfile: Dockerfile
    image: zabbix-glpi-integration:latest
    container_name: glpi-webhook
    logging: *default-logging
    environment:
      - GLPI_URL=http://glpi:80/apirest.php
      - GLPI_USER=glpi
      - GLPI_PASSWORD=glpi
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN:-}
      - GLPI_USER_TOKEN=${GLPI_USER_TOKEN:-}
      - GLPI_ENTITY_ID=0
      - ZABBIX_URL=http://zabbix-web:8080/api_jsonrpc.php
      - ZABBIX_API_TOKEN=${ZABBIX_API_TOKEN}
      - WEBHOOK_PORT=5002
      - WEBHOOK_HOST=0.0.0.0
      - DATABASE_PATH=/data/zabbix_glpi.db
      - TZ=${TIMEZONE:-Asia/Kolkata}
      # Internal CMDB sync scheduler (runs inside the container; no host cron)
      - INVENTORY_SYNC_ENABLED=true
      - INVENTORY_SYNC_INTERVAL=3600
      - INVENTORY_SYNC_INITIAL_DELAY=30
      # Internal auto-acknowledge scheduler (runs inside the container; no host cron)
      - AUTO_ACK_ENABLED=true
      - AUTO_ACK_INTERVAL=60
    volumes:
      - ./zabbix-glpi-integration:/app:ro
      - glpi_integration_data:/data
    # Port 5002 removed from host exposure; accessed via nginx or internal network.
    networks:
      - zabbix-net
    depends_on:
      - zabbix-server
      - zabbix-web
      - glpi
    restart: unless-stopped
    # Removed runtime pip install and manual gunicorn command.
    # The image built from the Dockerfile already contains all dependencies 
    # and defines the correct entrypoint/command.

  # ===========================================
  # 9. VictoriaMetrics (Safe Flags)
  # ===========================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.145.0
    container_name: victoriametrics
    logging: *default-logging
    volumes:
      - victoriametrics_data:/victoria-metrics-data
      - ./vmagent/relabel.yml:/etc/victoriametrics/relabel.yml:ro
    # Port 8428 removed from host exposure; accessed via nginx or internal network.
    networks:
      - zabbix-net
    restart: unless-stopped
    command:
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=12'
      - '-search.disableAutoCacheReset=true'
      - '-relabelConfig=/etc/victoriametrics/relabel.yml'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================
  # 10. Grafana  (Zabbix plugin auto-installed; datasource auto-provisioned)
  # ===========================================
  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    logging: *default-logging
    environment:
      # ── Admin ─────────────────────────────────────────────────────────────
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}

      # ── Server / Nginx sub-path ────────────────────────────────────────────
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=https://${SERVER_IP}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

      # ── Plugin auto-install on startup ─────────────────────────────────────
      # Grafana downloads & installs these when the container first starts
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app,grafana-clock-panel,grafana-piechart-panel,yesoreyeram-infinity-datasource

      # ── Allow unsigned zabbix datasource plugin ────────────────────────────
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=alexanderzobnin-zabbix-datasource

      # ── Zabbix API token (used by datasource.yml provisioning) ────────────
      - ZABBIX_API_TOKEN=${ZABBIX_API_TOKEN}

      # ── Metrics scraping ───────────────────────────────────────────────────
      - GF_METRICS_ENABLED=true
      - GF_METRICS_BASIC_AUTH_USERNAME=admin
      - GF_METRICS_BASIC_AUTH_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}

      # ── Timezone ───────────────────────────────────────────────────────────
      - TZ=${TIMEZONE:-Asia/Kolkata}

    volumes:
      - grafana_data:/var/lib/grafana
      # datasources.yml provisions Zabbix + VictoriaMetrics automatically
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

    networks:
      - zabbix-net
    depends_on:
      - victoriametrics
      - zabbix-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ===========================================
  # 11a. SNMP Exporter
  # ===========================================
  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    container_name: snmp-exporter
    logging: *default-logging
    volumes:
      - ./snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    networks:
      - zabbix-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9116/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # 11. VMAgent (Metrics Scraper)
  # ===========================================
  vmagent:
    image: victoriametrics/vmagent:v1.145.0
    container_name: vmagent
    logging: *default-logging
    environment:
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./vmagent/scrape.yml:/etc/vmagent/scrape.yml:ro
      - vmagent_data:/vmagentdata
    command:
      - '-promscrape.config=/etc/vmagent/scrape.yml'
      - '-remoteWrite.url=http://victoriametrics:8428/api/v1/write'
    networks:
      - zabbix-net
    depends_on:
      - victoriametrics
      - grafana
      - snmp-exporter
    restart: unless-stopped

  # ===========================================
  # 12. Zabbix → VictoriaMetrics Exporter — DECOMMISSIONED 2026-06-23
  # ===========================================
  # Removed: the Zabbix NATIVE CONNECTOR (ZBX_STARTCONNECTORS=1, see zabbix-server)
  # is now the single ingestion path. This custom exporter created a parallel,
  # duplicate copy of every metric under different names (zabbix_* vs native item
  # names) and a different visible-host label (host_name vs hostname), which made
  # dashboards inconsistent. The site/type/role/host_groups enrichment it provided
  # now lives in vmagent/relabel.yml, applied to the native path. Code retained in
  # ./zabbix-exporter/ for reference. To re-enable, restore this service block.

  # ===========================================
  # 12b. GLPI Exporter
  # ===========================================
  glpi-exporter:
    build:
      context: ./glpi-exporter
      dockerfile: Dockerfile
    image: glpi-exporter:latest
    container_name: glpi-exporter
    logging: *default-logging
    working_dir: /app
    environment:
      - GLPI_URL=http://glpi:80/apirest.php
      - GLPI_USER=glpi
      - GLPI_PASSWORD=glpi
      - VM_URL=http://victoriametrics:8428
      - EXPORT_INTERVAL=30
    volumes:
      - ./glpi-exporter:/app:ro
    networks:
      - zabbix-net
    depends_on:
      - glpi
      - victoriametrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f exporter.py || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ===========================================
  # 13. Nginx Reverse Proxy
  # ===========================================
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    logging: *default-logging
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - zabbix-net
    depends_on:
      - zabbix-web
      - glpi
      - grafana
      - reporting-portal
    restart: unless-stopped

  # ===========================================
  # 14. Reporting Portal
  # ===========================================
  reporting-portal:
    build:
      context: ./reporting-portal
      dockerfile: Dockerfile
    image: reporting-portal:latest
    container_name: reporting-portal
    logging: *default-logging
    environment:
      - ZABBIX_URL=http://zabbix-web:8080/api_jsonrpc.php
      - ZABBIX_USER=Admin
      - ZABBIX_PASSWORD=${ZABBIX_PASSWORD:-zabbix}
      - ZABBIX_API_TOKEN=${ZABBIX_API_TOKEN:-}
    volumes:
      - ./reporting-portal:/app:ro
    networks:
      - zabbix-net
    depends_on:
      - zabbix-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  zabbix-net:
    driver: bridge

volumes:
  postgres_data:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "zabbix-postgres"
      vault.protected: "true"
  glpi_mariadb_data:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "glpi-mariadb"
      vault.protected: "true"
  glpi_data:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "glpi"
      vault.protected: "true"
  glpi_config:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "glpi"
      vault.protected: "true"
  glpi_files:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "glpi"
      vault.protected: "true"
  glpi_marketplace:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "glpi"
      vault.protected: "true"
  glpi_plugins:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "glpi"
      vault.protected: "true"
  glpi_integration_data:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "glpi-webhook"
      vault.protected: "true"
  victoriametrics_data:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "victoriametrics"
      vault.protected: "true"
  grafana_data:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "grafana"
      vault.protected: "true"
  vmagent_data:
    labels:
      bound.hostname: "sonic-biochem-nic"
      bound.service: "vmagent"
      vault.protected: "true"

