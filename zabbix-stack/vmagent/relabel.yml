# Ingestion relabeling for VictoriaMetrics (-relabelConfig).
# AUTO-GENERATED from live Zabbix host.get (host, groups, tags, interface IP).
# Adds host_groups / host_type / site / role / host_ip labels to native-connector
# metrics, keyed on the Zabbix technical host name (`host`). Single ingestion path.
# Regenerate after host/group/tag/IP changes.

# NOTE: switch port alias (ifAlias) is ALREADY available as the `tag_description`
# label (Zabbix interface item tag "description" = {#IFALIAS}, exported by the
# native connector). VM -relabelConfig cannot rename it: the connector adds
# tag-derived labels AFTER relabeling runs, so they are invisible here. To expose
# it as `tag_ifalias` instead, rename that item-prototype tag in the switch
# templates (Zabbix side), not here.

# AIHOSTSERVER
- source_labels: [host]
  regex: 'AIHOSTSERVER'
  target_label: host_groups
  replacement: ',SONIC/Servers,Servers,'
- source_labels: [host]
  regex: 'AIHOSTSERVER'
  target_label: host_type
  replacement: 'Server'
- source_labels: [host]
  regex: 'AIHOSTSERVER'
  target_label: site
  replacement: 'SONIC'
- source_labels: [host]
  regex: 'AIHOSTSERVER'
  target_label: role
  replacement: 'Hypervisor'
- source_labels: [host]
  regex: 'AIHOSTSERVER'
  target_label: host_ip
  replacement: '10.95.0.20'
