global:
  scrape_interval: 30s

scrape_configs:
  # Scrape Grafana metrics via nginx proxy
  - job_name: 'grafana'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets: ['nginx-proxy:443']
    metrics_path: /grafana/metrics

  # Scrape VictoriaMetrics metrics
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']
    metrics_path: /metrics
