# SNMP Exporter configuration — IF-MIB metrics for switches and firewalls.
# Change community: below if your devices use a non-public community string.

auths:
  # SNMPv2c — used by switches and SEZ firewall
  public_v2:
    community: public
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2

  # SNMPv3 — used by FortiGate and Sophos firewalls
  snmpv3_firewall:
    version: 3
    username: imstool
    security_level: authPriv
    auth_protocol: MD5
    password: "L2$8n9e3l1sOT(QmC%"
    priv_protocol: DES
    priv_password: "L2$8n9e3l1sOT(QmC%"

modules:
  # Interface MIB: traffic, errors, discards, status.
  # Each metric gets ifName, ifAlias, ifDescr as labels via per-metric lookups.
  if_mib:
    walk:
    - 1.3.6.1.2.1.2          # interfaces (ifTable)
    - 1.3.6.1.2.1.31.1.1     # ifXTable (64-bit counters, ifName, ifAlias)
    get:
    - 1.3.6.1.2.1.1.3.0      # sysUpTime
    metrics:
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: The time (in hundredths of a second) since the network management portion of the system was last re-initialized.

    - name: ifNumber
      oid: 1.3.6.1.2.1.2.1
      type: gauge
      help: The number of network interfaces present on this system.

    - name: ifIndex
      oid: 1.3.6.1.2.1.2.2.1.1
      type: gauge
      help: A unique value, greater than zero, for each interface.
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifSpeed
      oid: 1.3.6.1.2.1.2.2.1.5
      type: gauge
      help: Interface nominal bandwidth in bits per second (32-bit; use ifHighSpeed for >1Gbps).
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifAdminStatus
      oid: 1.3.6.1.2.1.2.2.1.7
      type: gauge
      help: The desired state of the interface (1=up 2=down 3=testing).
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
      enum_values:
        1: up
        2: down
        3: testing

    - name: ifOperStatus
      oid: 1.3.6.1.2.1.2.2.1.8
      type: gauge
      help: The current operational state of the interface (1=up 2=down 3=testing 4=unknown 5=dormant 6=notPresent 7=lowerLayerDown).
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
      enum_values:
        1: up
        2: down
        3: testing
        4: unknown
        5: dormant
        6: notPresent
        7: lowerLayerDown

    - name: ifInOctets
      oid: 1.3.6.1.2.1.2.2.1.10
      type: counter
      help: Octets received on the interface (32-bit; use ifHCInOctets on Gbps links).
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifInDiscards
      oid: 1.3.6.1.2.1.2.2.1.13
      type: counter
      help: Inbound packets discarded despite no errors.
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifInErrors
      oid: 1.3.6.1.2.1.2.2.1.14
      type: counter
      help: Inbound packets that contained errors preventing delivery.
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifOutOctets
      oid: 1.3.6.1.2.1.2.2.1.16
      type: counter
      help: Octets transmitted out of the interface (32-bit; use ifHCOutOctets on Gbps links).
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifOutDiscards
      oid: 1.3.6.1.2.1.2.2.1.19
      type: counter
      help: Outbound packets discarded despite no errors.
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifOutErrors
      oid: 1.3.6.1.2.1.2.2.1.20
      type: counter
      help: Outbound packets that could not be transmitted because of errors.
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifHCInOctets
      oid: 1.3.6.1.2.1.31.1.1.1.6
      type: counter
      help: Octets received on the interface (64-bit high-capacity counter).
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifHCOutOctets
      oid: 1.3.6.1.2.1.31.1.1.1.10
      type: counter
      help: Octets transmitted out of the interface (64-bit high-capacity counter).
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString

    - name: ifHighSpeed
      oid: 1.3.6.1.2.1.31.1.1.1.15
      type: gauge
      help: Interface current bandwidth in units of 1,000,000 bits per second.
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels: [ifIndex]
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
      - labels: [ifIndex]
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
