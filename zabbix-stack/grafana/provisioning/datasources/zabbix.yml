apiVersion: 1

# Zabbix datasource (alexanderzobnin plugin). Used for direct Zabbix API queries
# (problems, triggers, host/group browsing). Numeric history/trends are also
# available from VictoriaMetrics, where the Zabbix server connector streams items.
datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: false
    editable: true
    jsonData:
      authType: "token"
      trends: true
      trendsFrom: "7d"
      trendsRange: "4d"
      cacheTTL: "1h"
      timeout: 90
    secureJsonData:
      apiToken: ${ZABBIX_API_TOKEN}
